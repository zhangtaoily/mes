<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数智工业互联平台 · 生产执行系统(MES) - 高保真原型</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.layout { display:flex; height:100vh; overflow:hidden; }
/* 侧边栏 */
.side { width:216px; background:#263445; color:#bfcbd9; display:flex; flex-direction:column; flex-shrink:0; }
.logo { height:56px; display:flex; align-items:center; justify-content:center; background:#1f2d3d; color:#fff; font-weight:700; font-size:14px; letter-spacing:1px; }
.menu { flex:1; overflow-y:auto; padding:4px 0; }
.m1 > .t { display:flex; align-items:center; gap:8px; padding:0 18px; height:44px; cursor:pointer; font-size:13.5px; color:#e6eef7; }
.m1 > .t:hover { background:#304156; }
.m1 > .t .arr { margin-left:auto; transition:.2s; font-size:10px; }
.m1.open > .t .arr { transform:rotate(90deg); }
.m2 { display:none; background:#1f2d3d; }
.m1.open .m2 { display:block; }
.m2 a { display:block; padding:0 18px 0 42px; height:36px; line-height:36px; color:#bfcbd9; font-size:13px; cursor:pointer; }
.m2 a:hover { color:#fff; background:#304156; }
.m2 a.on { color:#409eff; background:#263445; border-right:2px solid #409eff; }
/* 顶栏 */
.main { flex:1; display:flex; flex-direction:column; min-width:0; }
.topbar { height:56px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; align-items:center; padding:0 20px; gap:16px; z-index:5; }
.crumbs { color:#606266; font-size:13px; }
.crumbs b { color:#303133; }
.topbar .sp { flex:1; }
.userbox { display:flex; align-items:center; gap:8px; color:#606266; }
.avatar { width:30px; height:30px; border-radius:50%; background:#409eff; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; }
iframe { flex:1; border:none; width:100%; }
</style>
</head>
<body>
<div class="layout">
  <div class="side">
    <div class="logo">数智 · 生产执行系统</div>
    <div class="menu" id="menu"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="crumbs" id="crumbs">首页</div>
      <div class="sp"></div>
      <div class="userbox"><span class="avatar">张</span><span>张涛(011365)</span><span class="muted">2026-09-29 二</span></div>
    </div>
    <iframe id="frame" src="pages/dashboard.html"></iframe>
  </div>
</div>
<script>
const MENUS = [
 {n:"首页", icon:"⌂", page:"pages/dashboard.html", subs:[]},
 {n:"生产管理", icon:"▤", subs:[
   ["K3订单查看","pages/k3-order.html"],
   ["生产任务","pages/prod-task.html"],["生产任务(复精梳)","pages/prod-task.html"],["任务变更","pages/prod-task.html"],
   ["倒筒任务","pages/prod-task-dt.html"],["生产排程","pages/schedule.html"],["生产排程查看","pages/schedule.html"],
   ["领退料确认","pages/feed.html"],["生产任务其它信息","pages/prod-task.html"]]},
 {n:"工艺管理", icon:"⚙", subs:[
   ["计划工艺单","pages/plan-craft.html"],["计划工艺单查看","pages/plan-craft-edit.html"],["上机制造卡","pages/machine-card.html"],
   ["前纺生产情况汇报","pages/front-report.html"],
   ["车间工艺库","pages/ws-craft-list.html"],["技术工艺库","pages/workshop-craft.html"]]},
 {n:"质检管理", icon:"✓", subs:[
   ["抽样登记","pages/qc-sample.html"],["检验报告","pages/qc-report.html"],["检验报告(中心实验室)","pages/qc-lab.html"],
   ["质检公式","pages/qc-formula.html"],["包装质检报告","pages/qc-pack-report.html"],["公示检验报告","pages/qc-public.html"]]},
 {n:"现场管理", icon:"◉", subs:[
   ["投料记录","pages/feed-record.html"],["上批汇报","pages/batch-on.html"],["产量汇报","pages/output-report.html"],
   ["启停汇报","pages/stop-report.html"],["翻批日志","pages/batch-change-log.html"],["复精梳-毛球周转车","pages/truck.html"],
   ["自络筒切疵记录","pages/batch-on.html"],["蒸纱信息","pages/steam-info.html"],
   ["车间出勤","pages/attendance.html"],["车间排班","pages/schedule-plan.html"],["人员工时","pages/work-hours.html"],
   ["车间能耗","pages/energy.html"],["车间生产费用","pages/cost.html"],["现场问题反馈","pages/issue-feedback.html"]]},
 {n:"设备管理", icon:"🔧", subs:[
   ["保养计划","pages/equipment.html"],["保养记录","pages/maintain-record.html"],["点检记录","pages/check-record.html"],
   ["维保记录","pages/repair-record.html"],["责任机台","pages/duty-machine.html"],["基础字典","pages/equipment.html"]]},
 {n:"包装管理", icon:"▣", subs:[
   ["包装任务","pages/pack-task.html"],["包装执行","pages/pack-execute.html"],["装箱记录","pages/box-record.html"],
   ["组托记录","pages/pallet-record.html"],["箱贴补打","pages/pack-execute.html"],["WMS入库记录","pages/pack-execute.html"],
   ["倒毛包装任务","pages/pack-task.html"],["箱子删除记录","pages/pack-execute.html"]]},
 {n:"生产统计", icon:"▦", subs:[
   ["车间出勤","pages/attendance.html"],["车间排班","pages/attendance.html"],["车间能耗","pages/attendance.html"],
   ["车间生产费用","pages/attendance.html"],["车间现场问题反馈","pages/attendance.html"]]},
 {n:"报表", icon:"◫", subs:[["报表中心","pages/reports.html"]]},
 {n:"基础信息", icon:"☰", subs:[
   ["车间与班组","pages/base-info.html"],["设备信息","pages/machine-info.html"],["标识牌","pages/tag-board.html"],
   ["包装与打印","pages/pack-material.html"],["质检方案","pages/qc-scheme.html"],["字典","pages/dict.html"]]},
 {n:"系统管理", icon:"⚑", subs:[["用户/角色/组织","pages/sys-user.html"],["字典管理","pages/sys-dict.html"],["自动编码","pages/sys-code.html"]]}
];
const menuEl = document.getElementById('menu');
MENUS.forEach((m,i)=>{
  const d = document.createElement('div'); d.className='m1'+(i===0?' open':'');
  if(!m.subs.length){
    d.innerHTML = `<div class="t"><span>${m.icon}</span>${m.n}</div>`;
    d.querySelector('.t').onclick=()=>go(m.page, m.n, '');
  } else {
    let h = `<div class="t"><span>${m.icon}</span>${m.n}<span class="arr">▶</span></div><div class="m2">`;
    m.subs.forEach(s=>{ h+=`<a data-p="${s[1]}">${s[0]}</a>`; });
    d.innerHTML = h+'</div>';
    d.querySelector('.t').onclick=()=>{ document.querySelectorAll('.m1').forEach(x=>x.classList.remove('open')); d.classList.add('open'); };
    d.querySelectorAll('.m2 a').forEach(a=>{ a.onclick=(e)=>{ e.stopPropagation(); go(a.dataset.p, m.n, a.textContent); }; });
  }
  menuEl.appendChild(d);
});
const frame = document.getElementById('frame'), crumbs = document.getElementById('crumbs');
function go(p, m1, m2){
  frame.src = p;
  crumbs.innerHTML = m2 ? `${m1} / <b>${m2}</b>` : `<b>${m1}</b>`;
  document.querySelectorAll('.m2 a').forEach(a=>a.classList.toggle('on', a.textContent===m2 && a.dataset.p===p));
}
</script>
</body>
</html>
