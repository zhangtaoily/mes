<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>包装质检报告</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>生产车间</label><select class="ipt"><option>全部</option><option selected>纺四车间</option><option>纺六车间</option></select></div>
      <div class="search-item"><label>生产批次</label><input class="ipt" placeholder="XP2610151-4"></div>
      <div class="search-item"><label>入库批次</label><input class="ipt" placeholder="2607933-4"></div>
      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="btn-group">
      <button class="btn primary" onclick="location.href='qc-pack-report-edit.html'">新增</button>
      <button class="btn" onclick="t('请先勾选要删除的报告')">删除</button>
    </div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>车间</th><th>质检车间</th><th>批号</th><th>合格率</th><th>单据日期</th><th>创建人</th><th>创建时间</th><th>修改人</th><th>修改时间</th><th>操作</th></tr></thead>
      <tbody>
        <tr ondblclick="location.href='qc-pack-report-edit.html'" style="cursor:pointer"><td class="ck"><input type="checkbox" checked></td><td>1</td><td><a href="qc-pack-report-edit.html">纺四车间</a></td><td>质检五组</td><td>2607933-4</td><td>100%</td><td>2026-09-28</td><td>沈晓燕</td><td>2026-09-28 17:02:44</td><td>沈晓燕</td><td>2026-09-29 08:15:02</td><td class="op"><a href="qc-pack-report-edit.html">编辑</a></td></tr>
        <tr ondblclick="location.href='qc-pack-report-edit.html'" style="cursor:pointer"><td class="ck"><input type="checkbox"></td><td>2</td><td><a href="qc-pack-report-edit.html">纺六车间</a></td><td>质检五组</td><td>2607881-2</td><td>99.6%</td><td>2026-09-26</td><td>夏晓红</td><td>2026-09-26 16:40:18</td><td>—</td><td>—</td><td class="op"><a href="qc-pack-report-edit.html">编辑</a></td></tr>
        <tr ondblclick="location.href='qc-pack-report-edit.html'" style="cursor:pointer"><td class="ck"><input type="checkbox"></td><td>3</td><td><a href="qc-pack-report-edit.html">纺十车间</a></td><td>质检五组</td><td>2607902-1</td><td>99.2%</td><td>2026-09-27</td><td>夏晓红</td><td>2026-09-27 15:22:36</td><td>—</td><td>—</td><td class="op"><a href="qc-pack-report-edit.html">编辑</a></td></tr>
      </tbody>
    </table>
    <div class="pager">共 18 条 <select><option>50条/页</option></select> <span class="pno">‹</span><span class="pno on">1</span><span class="pno">›</span></div>
  </div>
</div>
<script>
function t(msg,ok){
  var d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;top:18px;right:18px;z-index:99;padding:10px 16px;border-radius:4px;font-size:13px;background:'+(ok?'#f0f9eb;border:1px solid #e1f3d8;color:#67c23a':'#fef0f0;border:1px solid #fde2e2;color:#f56c6c');
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},2600);
}
</script>
</body>
</html>
