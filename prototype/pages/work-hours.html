<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>人员工时</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>期间</label><input class="ipt" type="month" value="2026-09"></div>
      <div class="search-item"><label>车间</label><select class="ipt"><option>全部</option><option selected>纺四车间</option><option>纺六车间</option></select></div>
      <div class="search-item"><label>工时产线</label><select class="ipt"><option>全部</option><option selected>前纺</option><option>后纺</option><option>包装</option></select></div>
      <div class="search-item"><label>人员</label><input class="ipt" placeholder="陈阿二"></div>
      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="btn-group">
      <button class="btn primary">批量修改工时</button>
      <button class="btn" onclick="t('已导出人员工时明细（Excel）','ok')">导出</button>
    </div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>期间</th><th>工时产线</th><th>人员</th><th>工号</th><th>工时(小时)</th><th>修改人</th><th>修改时间</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td>2026-09</td><td>前纺</td><td>陈阿二</td><td>FS012-0236</td><td><input class="ipt" style="width:80px;height:26px" value="176"></td><td>admin</td><td>2026-09-28 10:15:22</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td>2026-09</td><td>前纺</td><td>钱林妹</td><td>FS012-0241</td><td><input class="ipt" style="width:80px;height:26px" value="168"></td><td>admin</td><td>2026-09-28 10:15:22</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td>2026-09</td><td>后纺</td><td>吴建平</td><td>FS012-0258</td><td><input class="ipt" style="width:80px;height:26px" value="182"></td><td>admin</td><td>2026-09-28 10:16:08</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td>2026-09</td><td>后纺</td><td>沈玉英</td><td>FS012-0263</td><td><input class="ipt" style="width:80px;height:26px" value="176"></td><td>admin</td><td>2026-09-28 10:16:08</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>5</td><td>2026-09</td><td>包装</td><td>王秀英</td><td>FS004-0112</td><td><input class="ipt" style="width:80px;height:26px" value="160"></td><td>admin</td><td>2026-09-28 10:17:31</td></tr>
      </tbody>
    </table>
    <div class="pager">共 1,204 条 <select><option>50条/页</option></select> <span class="pno">‹</span><span class="pno on">1</span><span class="pno">2</span><span class="pno">…</span><span class="pno">25</span><span class="pno">›</span></div>
    <div class="muted" style="padding:6px 2px">用于计件工资与绩效核算</div>
  </div>
</div>
<script>
function t(msg,ok){
  var d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;top:18px;right:18px;z-index:99;padding:10px 16px;border-radius:4px;font-size:13px;background:'+(ok?'#f0f9eb;border:1px solid #e1f3d8;color:#67c23a':'#fef0f0;border:1px solid #fde2e2;color:#f56c6c');
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},2600);
}
</script>
</body>
</html>
