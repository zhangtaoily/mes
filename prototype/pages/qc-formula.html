<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>质检公式</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>目标指标</label><input class="ipt" placeholder="每米重量"></div>
      <div class="search-item"><label>工序名称</label><select class="ipt"><option>全部</option><option selected>后针一</option><option>精梳</option><option>细纱</option></select></div>
      <div class="search-item"><label>车间类型</label><select class="ipt"><option>全部</option><option>前纺</option><option>后纺</option><option>复精梳车间</option></select></div>
      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="btn-group"><button class="btn primary" onclick="scrollTo(0,520)">新增</button><button class="btn" onclick="t('请先勾选要删除的公式')">删除</button></div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>工序</th><th>车间类型</th><th>类型</th><th>影响的质检项</th><th>目标指标</th><th>创建人</th><th>创建时间</th></tr></thead>
      <tbody>
        <tr ondblclick="scrollTo(0,520)" style="cursor:pointer"><td class="ck"><input type="checkbox" checked></td><td>1</td><td><a href="#" onclick="scrollTo(0,520);return false">后针一</a></td><td>前纺</td><td><span class="tag orange">工序检</span></td><td>每米重量、不匀率</td><td>每米重量</td><td>张伟</td><td>2026-03-12 10:22:31</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td><a href="#" onclick="scrollTo(0,520);return false">精梳</a></td><td>复精梳车间</td><td><span class="tag orange">工序检</span></td><td>短毛率、毛粒50克</td><td>短毛率</td><td>张伟</td><td>2026-03-15 14:08:52</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td><a href="#" onclick="scrollTo(0,520);return false">细纱</a></td><td>后纺</td><td><span class="tag orange">工序检</span></td><td>条干CV、千米疵点</td><td>条干CV</td><td>李强</td><td>2026-04-02 09:36:17</td></tr>
      </tbody>
    </table>
    <div class="pager">共 12 条 <select><option>50条/页</option></select> <span class="pno">‹</span><span class="pno on">1</span><span class="pno">›</span></div>
  </div>
  <div class="card">
    <div class="sec-title">质检公式编辑 - 每米重量不匀率计算</div>
    <div class="form-grid">
      <div class="form-item"><label>公式名称</label><div class="w"><input value="每米重量不匀率计算"></div></div>
      <div class="form-item"><label>工序名称</label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>后针一</option><option>前针二</option><option>精梳</option></select></div></div>
      <div class="form-item"><label>类型</label><div class="w"><input value="工序检" readonly></div></div>
      <div class="form-item"><label>车间类型</label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option>前纺</option><option>后纺</option><option selected>复精梳车间</option></select></div></div>
      <div class="form-item"><label>目标指标</label><div class="w"><input value="每米重量"></div></div>
      <div class="form-item"><label>影响的质检项</label><div class="w"><input value="每米重量、不匀率"></div></div>
      <div class="form-item"><label>排序</label><div class="w"><input value="0"></div></div>
      <div class="form-item full"><label>公式（JS脚本）</label><textarea style="height:150px;font-family:Consolas,monospace">var calculateBYL = function(){
  var zlObj = $BQ(202100000026);
  var avgVal = zlObj.avgVal;
  var sum = 0, n = 0;
  for (var i = 0; i < zlObj.vals.length; i++) {
    sum += Math.pow(zlObj.vals[i] - avgVal, 2);
    n++;
  }
  var cv = Math.sqrt(sum / n) / avgVal * 100;
  $SET("不匀率", cv.toFixed(2));
};
calculateBYL();</textarea></div>
    </div>
    <div class="btn-group"><button class="btn primary" onclick="t('质检公式保存成功','ok')">保存</button><button class="btn" onclick="scrollTo(0,0)">返回</button><button class="btn" onclick="t('公式校验通过：语法正确，$BQ(202100000026) 指向「每米重量」，$SET 目标「不匀率」存在','ok')">公式校验</button></div>
  </div>
</div>
<script>
function t(msg,ok){
  var d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;top:18px;right:18px;z-index:99;padding:10px 16px;border-radius:4px;font-size:13px;background:'+(ok?'#f0f9eb;border:1px solid #e1f3d8;color:#67c23a':'#fef0f0;border:1px solid #fde2e2;color:#f56c6c');
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},2600);
}
</script>
</body>
</html>
