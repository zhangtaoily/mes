<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>字典</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>字典类型</label><select class="ipt"><option>全部</option><option selected>停机原因</option><option>疵纱分类</option><option>故障分类</option><option>维修方式</option></select></div>
      <div class="search-item"><label>字典项</label><input class="ipt" placeholder="断纱"></div>
      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="btn-group"><button class="btn primary">新增</button><button class="btn">删除</button></div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>字典类型</th><th>字典项</th><th>值</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td rowspan="6">停机原因</td><td>断纱</td><td>1</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td>换批</td><td>2</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td>待料</td><td>3</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td>设备故障</td><td>4</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>5</td><td>计划停机</td><td>5</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>6</td><td>其它</td><td>9</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>7</td><td rowspan="5">疵纱分类</td><td>正纱</td><td>1</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>8</td><td>AA BB纱</td><td>2</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>9</td><td>尾纱</td><td>3</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>10</td><td>辫子纱</td><td>4</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>11</td><td>松捻纱/紧捻纱</td><td>5</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>12</td><td rowspan="3">故障分类</td><td>机械故障</td><td>1</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>13</td><td>电气故障</td><td>2</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>14</td><td>工艺调整</td><td>3</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>15</td><td rowspan="2">维修方式</td><td>更换配件</td><td>1</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>16</td><td>现场维修</td><td>2</td><td><span class="tag green">启用</span></td></tr>
      </tbody>
    </table>
    <div class="pager">共 48 条 <select><option>50条/页</option></select> <span class="pno">‹</span><span class="pno on">1</span><span class="pno">›</span></div>
  </div>
</div>
</body>
</html>
