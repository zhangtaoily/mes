<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>包装质检报告编辑</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="btn-group">
    <a class="btn" href="qc-pack-report.html">← 返回</a>
    <button class="btn primary" onclick="t('包装质检报告保存成功','ok')">保存</button>
  </div>

  <div class="card">
    <div class="sec-title" style="margin-top:0">包装质检报告编辑 - 2607933-4</div>
    <div class="form-grid">
      <div class="form-item"><label>入库批次<span class="req">*</span></label><div class="w"><input value="2607933-4"></div></div>
      <div class="form-item"><label>生产批次</label><div class="w"><input value="XP2610151-4"></div></div>
      <div class="form-item"><label>生产车间</label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>纺四车间</option><option>纺六车间</option></select></div></div>
      <div class="form-item"><label>包装车间<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>质检五组</option><option>质检四组</option></select></div></div>
      <div class="form-item"><label>单据日期</label><div class="w"><input type="date" value="2026-09-28"></div></div>
      <div class="form-item"><label>一等品数</label><div class="w"><input value="2076"></div></div>
      <div class="form-item"><label>合格率(%)</label><div class="w"><input value="100"></div></div>
      <div class="form-item full"><label>备注</label><textarea></textarea></div>
    </div>
    <div class="sub-tbl-title">疵纱明细</div>
    <table class="tbl">
      <thead><tr><th>序号</th><th>瑕疵分类</th><th>指标值</th><th>备注</th></tr></thead>
      <tbody>
        <tr><td>1</td><td><select class="ipt" style="height:26px"><option selected>正纱</option><option>AA BB纱</option><option>尾纱</option><option>辫子纱</option><option>松捻纱</option><option>紧捻纱</option><option>重纱</option><option>轻纱</option><option>断纱</option><option>多股纱</option><option>油纱</option><option>大小肚</option><option>乱纱</option><option>圈圈纱</option><option>其它</option></select></td><td><input class="ipt" style="width:100px;height:26px" value="2076"></td><td><input class="ipt" style="width:180px;height:26px"></td></tr>
        <tr><td>2</td><td><select class="ipt" style="height:26px"><option>正纱</option><option>AA BB纱</option><option>尾纱</option><option>辫子纱</option><option>松捻纱</option><option>紧捻纱</option><option>重纱</option><option>轻纱</option><option>断纱</option><option>多股纱</option><option>油纱</option><option>大小肚</option><option>乱纱</option><option>圈圈纱</option><option selected>其它</option></select></td><td><input class="ipt" style="width:100px;height:26px" value="0"></td><td><input class="ipt" style="width:180px;height:26px"></td></tr>
        <tr><td>3</td><td><select class="ipt" style="height:26px"><option>正纱</option><option>AA BB纱</option><option>尾纱</option><option>辫子纱</option><option>松捻纱</option><option>紧捻纱</option><option>重纱</option><option>轻纱</option><option>断纱</option><option>多股纱</option><option>油纱</option><option>大小肚</option><option>乱纱</option><option>圈圈纱</option><option>其它</option></select></td><td><input class="ipt" style="width:100px;height:26px"></td><td><input class="ipt" style="width:180px;height:26px"></td></tr>
      </tbody>
    </table>
    <div class="btn-group"><button class="btn" onclick="addRow()">添加行</button></div>
  </div>
</div>
<script>
function t(msg,ok){
  var d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;top:18px;right:18px;z-index:99;padding:10px 16px;border-radius:4px;font-size:13px;background:'+(ok?'#f0f9eb;border:1px solid #e1f3d8;color:#67c23a':'#fef0f0;border:1px solid #fde2e2;color:#f56c6c');
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},2600);
}
function addRow(){
  var tb=document.querySelector('.card tbody');
  var tr=document.createElement('tr');
  var opts=tb.rows[0].cells[1].innerHTML;
  tr.innerHTML='<td>'+(tb.rows.length+1)+'</td><td>'+opts.replace(' selected','')+'</td><td><input class="ipt" style="width:100px;height:26px"></td><td><input class="ipt" style="width:180px;height:26px"></td>';
  tb.appendChild(tr);
  t('已添加疵纱明细行','ok');
}
</script>
</body>
</html>
