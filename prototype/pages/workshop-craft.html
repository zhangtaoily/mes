<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>技术工艺库</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>工艺名称</label><input class="ipt" placeholder="倒丝"></div>
      <div class="search-item"><label>工艺等级</label><select class="ipt"><option>全部</option><option selected>A级</option><option>B级</option><option>C级</option></select></div>
      <button class="btn primary">查询</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="btn-group">
      <button class="btn primary" onclick="location.href='workshop-craft-edit.html'">新增</button>
      <button class="btn" onclick="op('删除',true,'删除后不可再被新计划工艺单引用（已引用的单据不受影响），确认删除？')">删除</button>
      <button class="btn success" onclick="op('启用',true,'启用后该技术工艺可被计划工艺单/生产任务引用，确认启用？')">启用</button>
      <button class="btn warn" onclick="op('停用',true,'停用后不可被新单引用，已引用单据不受影响，确认停用？')">停用</button>
      <button class="btn" onclick="if(confirm('按最新工艺项定义刷新全部工序的工艺项显示排序？'))toast('工序工艺项排序已刷新','ok')">刷新工序工艺项排序</button>
    </div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>工艺编号</th><th>工艺名称</th><th>成分</th><th>实纺支数</th><th>工艺等级</th><th>染色方式</th><th>捻度</th><th>是否启用</th><th>创建人</th><th>创建时间</th></tr></thead>
      <tbody>
        <tr ondblclick="location.href='workshop-craft-edit.html'" style="cursor:pointer"><td class="ck"><input type="checkbox" checked></td><td>1</td><td><a href="workshop-craft-edit.html">CT000006</a></td><td>倒丝</td><td>100%羊毛</td><td>2/48 NM</td><td>A级</td><td>条染</td><td>620T/m</td><td><span class="tag green">启用</span></td><td>张伟</td><td>2026-01-12 10:22:36</td></tr>
        <tr ondblclick="location.href='workshop-craft-edit.html'" style="cursor:pointer"><td class="ck"><input type="checkbox"></td><td>2</td><td><a href="workshop-craft-edit.html">CT000011</a></td><td>巴素兰</td><td>70%澳毛 30%尼龙</td><td>2/60 NM</td><td>A级</td><td>条染</td><td>580T/m</td><td><span class="tag green">启用</span></td><td>张伟</td><td>2026-02-03 14:18:52</td></tr>
        <tr ondblclick="location.href='workshop-craft-edit.html'" style="cursor:pointer"><td class="ck"><input type="checkbox"></td><td>3</td><td><a href="workshop-craft-edit.html">CT000018</a></td><td>纺缩</td><td>100%羊毛</td><td>2/100 NM</td><td>B级</td><td>胚纱</td><td>680T/m</td><td><span class="tag green">启用</span></td><td>李强</td><td>2026-03-15 09:36:20</td></tr>
        <tr ondblclick="location.href='workshop-craft-edit.html'" style="cursor:pointer"><td class="ck"><input type="checkbox"></td><td>4</td><td><a href="workshop-craft-edit.html">CT000025</a></td><td>圈圈纱</td><td>80%羊毛 20%白厂丝</td><td>3300 NM</td><td>C级</td><td>条染</td><td>—</td><td><span class="tag gray">停用</span></td><td>李强</td><td>2026-04-08 15:42:11</td></tr>
      </tbody>
    </table>
    <div class="pager">共 35 条 <select><option>50条/页</option></select> <span class="pno">‹</span><span class="pno on">1</span><span class="pno">›</span></div>
  </div>
</div>
<script>
function toast(msg,ok){
  var d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;top:18px;right:18px;z-index:99;padding:10px 16px;border-radius:4px;font-size:13px;background:'+(ok?'#f0f9eb;border:1px solid #e1f3d8;color:#67c23a':'#fef0f0;border:1px solid #fde2e2;color:#f56c6c');
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},2600);
}
function op(act,needCk,msg){
  var cks=document.querySelectorAll('tbody .ck input:checked');
  if(needCk&&!cks.length){toast('请先勾选要'+act+'的工艺库');return false;}
  if(confirm(msg)){
    cks.forEach(function(c){
      var tr=c.closest('tr');
      var tag=tr.querySelector('.tag');
      if(act==='删除'){tr.remove();}
      else if(act==='启用'&&tag){tag.className='tag green';tag.textContent='启用';}
      else if(act==='停用'&&tag){tag.className='tag gray';tag.textContent='停用';}
    });
    if(act==='删除')toast('已删除 '+cks.length+' 条工艺库','ok');
    else if(act==='启用')toast('已启用 '+cks.length+' 条，可被新单引用','ok');
    else if(act==='停用')toast('已停用 '+cks.length+' 条，新单不可再引用','ok');
    return true;
  }
  return false;
}
</script>
</body>
</html>
