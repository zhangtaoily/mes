<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>车间能耗</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>期间</label><input class="ipt" type="month" value="2026-09"></div>
      <div class="search-item"><label>车间</label><select class="ipt"><option>全部</option><option selected>纺四车间</option><option>纺六车间</option></select></div>
      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="sec-title">能耗主表 - 2026-09 纺四车间</div>
    <div class="form-grid">
      <div class="form-item"><label>期间<span class="req">*</span></label><div class="w"><input type="month" value="2026-09"></div></div>
      <div class="form-item"><label>车间<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>纺四车间</option><option>纺六车间</option></select></div></div>
      <div class="form-item"><label>用水(吨)</label><div class="w"><input value="1286.5"></div></div>
      <div class="form-item"><label>用电(KWh)</label><div class="w"><input value="386420"></div></div>
      <div class="form-item"><label>用气(m³)</label><div class="w"><input value="45210"></div></div>
    </div>
    <div class="btn-group"><button class="btn primary">保存</button><button class="btn">提交</button><button class="btn success">审核通过</button></div>
    <div class="sub-tbl-title">机台明细能耗</div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>机台</th><th>机型</th><th>用水(吨)</th><th>用电(KWh)</th><th>用气(m³)</th><th>运转率(%)</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td>110倍捻12</td><td>VTS-08</td><td>0</td><td>8260</td><td>0</td><td>92.4</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td>细纱05</td><td>RFCS32</td><td>0</td><td>15820</td><td>0</td><td>89.6</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td>络筒02</td><td>NO.21C</td><td>12.5</td><td>9640</td><td>0</td><td>85.2</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td>蒸纱机01</td><td>XY-2000</td><td>86.2</td><td>4260</td><td>45210</td><td>78.0</td></tr>
      </tbody>
    </table>
    <div class="muted" style="padding:6px 2px">用于单位产量能耗考核（电耗报表数据源）</div>
  </div>
</div>
</body>
</html>
