<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>检验报告编辑</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card">
    <div class="btn-group" style="margin-top:0">
      <a class="btn" href="qc-report.html">← 返回</a>
      <button class="btn primary">保存</button>
    </div>
    <div class="sec-title" style="margin-top:0">检验报告编辑 - QC2026092901254</div>
    <div class="form-grid">
      <div class="form-item"><label>编号</label><div class="w">QC2026092901254</div></div>
      <div class="form-item"><label>车间<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>纺十二车间</option><option>纺四车间</option><option>纺六车间</option></select></div></div>
      <div class="form-item"><label>类型</label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>原料检</option><option>工序检</option><option>成品检</option></select></div></div>
      <div class="form-item"><label>车间产线</label><div class="w"><input value="纺十二1线"></div></div>
      <div class="form-item"><label>机台名称</label><div class="w"><input value="混条一03"></div></div>
      <div class="form-item"><label>班组<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>甲班</option><option>乙班</option><option>丙班</option></select></div></div>
      <div class="form-item"><label>序号</label><div class="w"><input value="1"></div></div>
      <div class="form-item"><label>生产批次</label><div class="w"><input value="XJP2610052 12"></div></div>
      <div class="form-item"><label>检验员<span class="req">*</span></label><div class="w"><input value="沈晓燕"></div></div>
      <div class="form-item"><label>检验日期<span class="req">*</span></label><div class="w"><input type="date" value="2026-09-29"></div></div>
      <div class="form-item"><label>取样数量</label><div class="w"><input value="0"></div></div>
      <div class="form-item"><label>留样数量</label><div class="w"><input value="0"></div></div>
      <div class="form-item"><label>单位</label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>克</option><option>根</option><option>筒</option></select></div></div>
      <div class="form-item full"><label>备注</label><textarea></textarea></div>
    </div>
    <div class="sub-tbl-title">质检方案（横向指标矩阵）</div>
    <table class="tbl">
      <thead><tr><th>指标项</th><th>试样1</th><th>试样2</th><th>试样3</th><th>试样4</th><th>单位</th></tr></thead>
      <tbody>
        <tr><td>每米重量</td><td><input class="ipt" style="width:90px;height:26px" value="19.25"></td><td><input class="ipt" style="width:90px;height:26px" value="19.30"></td><td><input class="ipt" style="width:90px;height:26px" value="19.18"></td><td><input class="ipt" style="width:90px;height:26px" value="19.22"></td><td>g/m</td></tr>
        <tr><td>含油</td><td><input class="ipt" style="width:90px;height:26px" value="0.82"></td><td><input class="ipt" style="width:90px;height:26px" value="0.79"></td><td><input class="ipt" style="width:90px;height:26px" value="0.85"></td><td><input class="ipt" style="width:90px;height:26px" value="0.80"></td><td>%</td></tr>
        <tr><td>回潮</td><td><input class="ipt" style="width:90px;height:26px" value="16.20"></td><td><input class="ipt" style="width:90px;height:26px" value="16.05"></td><td><input class="ipt" style="width:90px;height:26px" value="15.98"></td><td><input class="ipt" style="width:90px;height:26px" value="16.11"></td><td>%</td></tr>
        <tr><td>长度</td><td><input class="ipt" style="width:90px;height:26px" value="88.5"></td><td><input class="ipt" style="width:90px;height:26px" value="87.9"></td><td><input class="ipt" style="width:90px;height:26px" value="88.2"></td><td><input class="ipt" style="width:90px;height:26px" value="88.8"></td><td>mm</td></tr>
        <tr><td>离散</td><td><input class="ipt" style="width:90px;height:26px" value="34.2"></td><td><input class="ipt" style="width:90px;height:26px" value="33.8"></td><td><input class="ipt" style="width:90px;height:26px" value="34.6"></td><td><input class="ipt" style="width:90px;height:26px" value="34.0"></td><td>CV%</td></tr>
        <tr><td>短毛率</td><td><input class="ipt" style="width:90px;height:26px" value="3.8"></td><td><input class="ipt" style="width:90px;height:26px" value="4.1"></td><td><input class="ipt" style="width:90px;height:26px" value="3.6"></td><td><input class="ipt" style="width:90px;height:26px" value="3.9"></td><td>%</td></tr>
        <tr><td>疵点</td><td><input class="ipt" style="width:90px;height:26px" value="0.6"></td><td><input class="ipt" style="width:90px;height:26px" value="0.5"></td><td><input class="ipt" style="width:90px;height:26px" value="0.8"></td><td><input class="ipt" style="width:90px;height:26px" value="0.4"></td><td>个/g</td></tr>
        <tr><td>不匀率</td><td><input class="ipt" style="width:90px;height:26px" value="3.2"></td><td><input class="ipt" style="width:90px;height:26px" value="3.4"></td><td><input class="ipt" style="width:90px;height:26px" value="3.1"></td><td><input class="ipt" style="width:90px;height:26px" value="3.3"></td><td>%</td></tr>
        <tr><td>毛粒50克</td><td><input class="ipt" style="width:90px;height:26px" value="1.2"></td><td><input class="ipt" style="width:90px;height:26px" value="1.5"></td><td><input class="ipt" style="width:90px;height:26px" value="1.0"></td><td><input class="ipt" style="width:90px;height:26px" value="1.3"></td><td>个</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
