<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>启停汇报编辑</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="btn-group">
    <a class="btn" href="stop-report.html">← 返回</a>
    <button class="btn primary" onclick="t('启停汇报保存成功','ok')">保存</button>
  </div>
  <div class="card">
    <div class="sec-title" style="margin-top:0">启停汇报编辑 - TJ2609290012</div>
    <div class="form-grid">
      <div class="form-item"><label>停机编号</label><div class="w">TJ2609290012（自动生成）</div></div>
      <div class="form-item"><label>车间名称<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>纺八车间</option><option>纺四车间</option><option>纺六车间</option></select></div></div>
      <div class="form-item"><label>设备机型</label><div class="w"><input value="RFCS2细纱机"></div></div>
      <div class="form-item"><label>机台名称<span class="req">*</span></label><div class="w"><input value="细纱12"></div></div>
      <div class="form-item"><label>汇报班组<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>甲班</option><option>乙班</option><option>丙班(白班)</option></select></div></div>
      <div class="form-item"><label>汇报人<span class="req">*</span></label><div class="w"><input value="王建国"></div></div>
      <div class="form-item"><label>汇报日期<span class="req">*</span></label><div class="w"><input type="date" value="2026-09-29"></div></div>
      <div class="form-item"><label>停机时长<span class="req">*</span></label><div class="w"><input value="35分钟"> <select style="border:none;outline:none;font-size:13px;color:#606266"><option selected>分钟</option><option>小时</option></select></div></div>
      <div class="form-item"><label>停机原因<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>撞车</option><option>落料</option><option>停机</option><option>其他</option></select></div></div>
      <div class="form-item full"><label>备注</label><textarea>钢丝圈飞脱</textarea></div>
    </div>
  </div>
</div>
<script>
function t(msg,ok){
  var d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;top:18px;right:18px;z-index:99;padding:10px 16px;border-radius:4px;font-size:13px;background:'+(ok?'#f0f9eb;border:1px solid #e1f3d8;color:#67c23a':'#fef0f0;border:1px solid #fde2e2;color:#f56c6c');
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},2600);
}
</script>
</body>
</html>
