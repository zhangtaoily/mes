<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>车间出勤</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>期间</label><input class="ipt" type="month" value="2026-09"></div>
      <div class="search-item"><label>车间</label><select class="ipt"><option>全部</option><option selected>纺四车间</option><option>纺六车间</option><option>纺十车间</option></select></div>
      <div class="search-item"><label>状态</label><select class="ipt"><option>全部</option><option selected>已审核</option><option>已提交</option><option>保存</option></select></div>
      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="btn-group">
      <button class="btn primary">Excel导入</button><button class="btn">提交</button>
      <button class="btn success">审核通过</button><button class="btn warn">撤回</button>
    </div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>期间</th><th>车间</th><th>开工天数</th><th>车间管理人员</th><th>常日班辅助</th><th>一线员工</th><th>质检组出勤</th><th>总出勤</th><th>折算出勤</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td><a href="#">2026-09</a></td><td>纺四车间</td><td>22</td><td>8</td><td>12</td><td>356</td><td>18</td><td>394</td><td>382.5</td><td><span class="tag green">已审核</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td><a href="#">2026-09</a></td><td>纺六车间</td><td>22</td><td>7</td><td>10</td><td>298</td><td>15</td><td>330</td><td>321.0</td><td><span class="tag orange">已提交</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td><a href="#">2026-09</a></td><td>纺十车间</td><td>21</td><td>6</td><td>11</td><td>265</td><td>14</td><td>296</td><td>288.5</td><td><span class="tag orange">已提交</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td><a href="#">2026-09</a></td><td>纺十二车间</td><td>22</td><td>6</td><td>9</td><td>241</td><td>12</td><td>268</td><td>260.0</td><td><span class="tag blue">保存</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>5</td><td><a href="#">2026-08</a></td><td>纺四车间</td><td>23</td><td>8</td><td>12</td><td>361</td><td>18</td><td>399</td><td>386.0</td><td><span class="tag green">已审核</span></td></tr>
      </tbody>
    </table>
    <div class="pager">共 36 条 <select><option>50条/页</option></select> <span class="pno">‹</span><span class="pno on">1</span><span class="pno">›</span></div>
    <div class="muted" style="padding:6px 2px">流程：导入 → 保存 → 提交 → 审核通过（可驳回/撤回）；折算出勤=按班次系数折算的出勤人日，用于产量/绩效分摊</div>
  </div>
</div>
</body>
</html>
