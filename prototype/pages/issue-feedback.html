<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>车间现场问题反馈</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>检查人</label><input class="ipt" placeholder="王建国"></div>
      <div class="search-item"><label>检查日期</label><input class="ipt" type="date" value="2026-09-01"> ~ <input class="ipt" type="date" value="2026-09-29"></div>

      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="btn-group"><button class="btn primary">新增</button></div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>检查人</th><th>检查日期</th><th>问题所在</th><th>问题描述</th><th>整改状态</th><th>操作</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td>王建国</td><td>2026-09-28</td><td>纺四车间/细纱05</td><td>机台地面有回丝散落，6S不达标</td><td><span class="tag orange">整改中</span></td><td class="op"><a href="#">查看</a><a href="#">闭环</a></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td>王建国</td><td>2026-09-26</td><td>纺六车间/络筒02</td><td>筒管混放，标识不清</td><td><span class="tag green">已整改</span></td><td class="op"><a href="#">查看</a></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td>李国强</td><td>2026-09-25</td><td>纺十二车间/通道</td><td>消防通道被毛球车占用</td><td><span class="tag green">已整改</span></td><td class="op"><a href="#">查看</a></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td>李国强</td><td>2026-09-24</td><td>纺十车间/前针二11</td><td>针板积毛未清理，影响条干</td><td><span class="tag red">待整改</span></td><td class="op"><a href="#">查看</a><a href="#">闭环</a></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>5</td><td>赵雪芬</td><td>2026-09-22</td><td>质检五组/包装区</td><td>纸箱堆放超高，存在安全隐患</td><td><span class="tag green">已整改</span></td><td class="op"><a href="#">查看</a></td></tr>
      </tbody>
    </table>
    <div class="pager">共 42 条 <select><option>50条/页</option></select> <span class="pno">‹</span><span class="pno on">1</span><span class="pno">›</span></div>
  </div>
</div>

</html>
