<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>车间排班</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>车间</label><select class="ipt"><option>全部</option><option selected>纺十二车间</option><option>纺四车间</option></select></div>
      <div class="search-item"><label>班组</label><select class="ipt"><option>全部</option><option selected>甲班</option><option>乙班</option><option>丙班</option></select></div>
      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="sec-title">排班主表</div>
    <div class="form-grid">
      <div class="form-item"><label>车间<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>纺十二车间</option><option>纺四车间</option></select></div></div>
      <div class="form-item"><label>班组<span class="req">*</span></label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>甲班</option><option>乙班</option><option>丙班</option><option>常日班</option></select></div></div>
      <div class="form-item"><label>班次</label><div class="w"><select style="border:none;outline:none;flex:1;font-size:13px;color:#606266"><option selected>两班倒</option><option>常日班</option><option>三班倒</option></select></div></div>
      <div class="form-item"><label>上班时间</label><div class="w"><input value="08:00"></div></div>
      <div class="form-item"><label>下班时间</label><div class="w"><input value="16:30"></div></div>
      <div class="form-item"><label>起始日期</label><div class="w"><input type="date" value="2026-10-01"></div></div>
      <div class="form-item"><label>截止日期</label><div class="w"><input type="date" value="2026-10-31"></div></div>
    </div>
    <div class="btn-group">
      <button class="btn primary">保存</button><button class="btn">复制（复制上一周期排班）</button>
      <button class="btn success">生成每日排班</button>
    </div>
    <div class="sub-tbl-title">排班人员</div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>姓名</th><th>工号</th><th>机台</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td>陈阿二</td><td>FS012-0236</td><td>细纱05</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td>钱林妹</td><td>FS012-0241</td><td>细纱06</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td>吴建平</td><td>FS012-0258</td><td>络筒02</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td>沈玉英</td><td>FS012-0263</td><td>倍捻11</td></tr>
      </tbody>
    </table>
    <div class="sub-tbl-title">上机机台</div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>机台号</th><th>品种/批次</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td>细纱05</td><td>普通毛(条染) / XJP2610052</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td>细纱06</td><td>巴素兰(复精梳) / 26091341</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td>络筒02</td><td>倒筒纱(条染) / 26091518</td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td>倍捻11</td><td>超缩(胚纱) / 26091519</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
