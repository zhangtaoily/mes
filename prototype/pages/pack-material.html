<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>包装与打印</title>
<link rel="stylesheet" href="../assets/style.css"></head>
<body>
<div class="page">
  <div class="card" style="margin-bottom:12px">
    <div class="search-bar">
      <div class="search-item"><label>包装材质</label><input class="ipt" placeholder="内销纸箱(标准)"></div>
      <button class="btn primary">搜索</button><button class="btn">重置</button>
    </div>
  </div>
  <div class="card">
    <div class="sec-title mt0">包装材质</div>
    <div class="btn-group"><button class="btn primary">新增</button><button class="btn">删除</button></div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>包装材质</th><th>包装规格(长×宽×高)</th><th>纸箱重量(KG)</th><th>标准筒数</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td><a href="#">内销纸箱(标准)</a></td><td>620×420×580</td><td>1.8</td><td>24</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td><a href="#">内胆纸箱(实重)</a></td><td>580×400×560</td><td>2.0</td><td>24</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td><a href="#">外销纸箱</a></td><td>620×420×620</td><td>2.2</td><td>26</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td><a href="#">标准带RWS认证(英文)</a></td><td>620×420×580</td><td>1.8</td><td>24</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>5</td><td><a href="#">标准</a></td><td>580×400×560</td><td>1.8</td><td>26</td><td><span class="tag green">启用</span></td></tr>
      </tbody>
    </table>
  </div>
  <div class="card">
    <div class="sec-title">打印模板</div>
    <div class="btn-group"><button class="btn primary">新增</button><button class="btn">删除</button></div>
    <table class="tbl">
      <thead><tr><th class="ck"><input type="checkbox"></th><th>序号</th><th>模板名称</th><th>模板类型</th><th>纸张类型</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td class="ck"><input type="checkbox" checked></td><td>1</td><td>筒贴-标准带RWS(英文)</td><td>筒贴</td><td>热敏纸76×36</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>2</td><td>箱单-标准带RWS(英文)</td><td>箱单</td><td>A4</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>3</td><td>唛架-标准</td><td>唛架</td><td>A4</td><td><span class="tag green">启用</span></td></tr>
        <tr><td class="ck"><input type="checkbox"></td><td>4</td><td>流程单-标准</td><td>流程单</td><td>A4</td><td><span class="tag green">启用</span></td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
